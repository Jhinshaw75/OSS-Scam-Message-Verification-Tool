 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Digital Safeguard - Scam Detector</title>
    <!-- Add your original styles here -->
</head>
<body>

<div class="container">
    <!-- Restoring exact original HTML structure -->
    <div style="text-align: center; margin-bottom: 15px;">
        <span style="font-weight: bold; font-size: 18px; color: #1a365d;">Elder Affairs FLORIDA</span>
        <span style="display: inline-block; margin-left: 10px; padding: 2px 8px; background: #fbbf24; font-size: 11px; font-weight: bold; border-radius: 4px;">SENIOR SHIELD</span>
    </div>

    <h2>Scam Detector</h2>
    <div class="subtitle">Instant Scam & Fraud Protection Analyzer</div>

    <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: center;">
        Want to stay ahead of the latest scams? <strong>Sign up for OSS Updates</strong> to get safety alerts straight to your inbox. <a href="#" style="background: #1e3a8a; color: white; padding: 4px 10px; border-radius: 4px; text-decoration: none; margin-left: 5px; font-size: 12px; display: inline-block;">Sign Up Now</a>
    </div>

    <textarea id="message-input" placeholder="Paste the suspicious text, email, or message here..."></textarea>
    
    <div class="btn-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="analyze-btn" onclick="runAnalysis()" style="flex: 1; background: #1e3a8a; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Analyze Message</button>
        <button id="clear-btn" onclick="clearAll()" style="flex: 1; background: #e2e8f0; color: #334155; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Clear</button>
    </div>

    <div id="output" class="result-box" style="display: none; padding: 15px; border-radius: 6px; margin-top: 15px;"></div>
</div>

<script>
    // EXACT ARRAY WITH ONLY THE STREAMING UPDATE APPLIED
    const threats = [
        {
            keys: ['netflix', 'streaming bill', 'subscription failed', 'subscription suspended'],
            title: "Fake TV / Streaming Bill Scam",
            desc: "A fake bill notice claims your Netflix, TV, or movie streaming payment failed to steal your credit card number.",
            warn: "They are using popular subscription names to steal updated credit card details.",
            linkText: "DOEA Fraud Protection Programs",
            linkUrl: "https://elderaffairs.org/programs-and-services/elder-protection-programs-fraud-trends/"
        },
        {
            keys: ['social security', 'ssn', 's.s.n'],
            title: "Fake Social Security Scam",
            desc: "Someone is falsely claiming your Social Security number or benefits have been canceled or frozen.",
            warn: "They are trying to trick you into handing over your sensitive personal numbers.",
            linkText: "DOEA File a Complaint Portal",
            linkUrl: "https://elderaffairs.org/resources/file-a-complaint/"
        }
    ];

    function runAnalysis() {
        const inputText = document.getElementById('message-input').value.trim();
        const outputBox = document.getElementById('output');
        
        if (!inputText) {
            outputBox.style.display = 'block';
            outputBox.style.backgroundColor = '#fef2f2';
            outputBox.style.border = '1px solid #fecaca';
            outputBox.style.color = '#991b1b';
            outputBox.innerHTML = '<h3>Input Required</h3><p>Please enter or paste a message to analyze.</p>';
            return;
        }

        const lowerText = inputText.toLowerCase();
        let matchedThreat = null;

        for (let threat of threats) {
            for (let key of threat.keys) {
                if (lowerText.includes(key)) {
                    matchedThreat = threat;
                    break;
                }
            }
            if (matchedThreat) break;
        }

        outputBox.style.display = 'block';

        if (matchedThreat) {
            outputBox.style.backgroundColor = '#fef2f2';
            outputBox.style.border = '1px solid #fecaca';
            outputBox.style.color = '#991b1b';
            outputBox.innerHTML = `
                <h3 style="margin-top:0;">⚠️ ${matchedThreat.title}</h3>
                <p><strong>What this means:</strong> ${matchedThreat.desc}</p>
                <p><strong>The Risk:</strong> ${matchedThreat.warn}</p>
                <a href="${matchedThreat.linkUrl}" target="_blank" style="color: #1d4ed8; font-weight: bold; text-decoration: none;">${matchedThreat.linkText} &rarr;</a>
            `;
        } else {
            outputBox.style.backgroundColor = '#f0fdf4';
            outputBox.style.border = '1px solid #bbf7d0';
            outputBox.style.color = '#166534';
            outputBox.innerHTML = `
                <h3 style="margin-top:0;">✅ This looks okay.</h3>
                <p>No common scam words or threat patterns found. Even so, because you can never be too careful, utilize our verified <a href="https://elderaffairs.org" target="_blank" style="color: #1d4ed8; font-weight: bold; text-decoration: none;">Operation Senior Shield Resource Hub</a> if you ever feel uncertain.</p>
            `;
        }
    }

    function clearAll() {
        document.getElementById('message-input').value = '';
        const outputBox = document.getElementById('output');
        outputBox.style.display = 'none';
        outputBox.innerHTML = '';
    }
</script>

</body>
</html>
