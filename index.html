 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Digital Safeguard | Fraud & Scam Analysis Tool</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --accent-blue: #2563eb;
            --border-color: #cbd5e1;
            --danger-bg: #fef2f2;
            --danger-border: #f87171;
            --danger-text: #991b1b;
            --safe-bg: #f0fdf4;
            --safe-border: #4ade80;
            --safe-text: #166534;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button.secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            flex: 0.4;
        }

        button.secondary:hover {
            background-color: #cbd5e1;
        }

        /* Results Output Styling */
        #resultContainer {
            display: none;
        }

        .halt-box {
            background-color: var(--danger-bg);
            border-left: 6px solid var(--danger-border);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .halt-box h3 {
            color: var(--danger-text);
            margin-top: 0;
            font-size: 1.25rem;
        }

        .safe-box {
            background-color: var(--safe-bg);
            border-left: 6px solid var(--safe-border);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .safe-box h3 {
            color: var(--safe-text);
            margin-top: 0;
            font-size: 1.25rem;
        }

        .action-steps ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .action-steps li {
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .official-resources {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .official-resources h4 {
            margin-top: 0;
            color: var(--primary);
        }

        .official-resources ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .official-resources li {
            margin-bottom: 8px;
        }

        .official-resources a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .official-resources a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Senior Digital Safeguard</h1>
        <p>Instant Scam & Fraud Protection Analyzer</p>
    </header>

    <div class="card">
        <label for="scamInput">Paste suspicious text, email, or message below:</label>
        <textarea id="scamInput" placeholder="Example: 'URGENT: Your bank account has been locked due to suspicious activity. Click here immediately to verify your info...'"></textarea>
        
        <div class="btn-group">
            <button onclick="analyzeMessage()">Analyze Message</button>
            <button class="secondary" onclick="clearForm()">Clear</button>
        </div>
    </div>

    <div id="resultContainer" class="card">
        <!-- Dynamic Agentic Output lands here -->
    </div>

    <footer>
        <p>Aligned with Florida Department of Elder Affairs (DOEA) & Operation Senior Shield Guidelines.</p>
    </footer>
</div>

<script>
    function analyzeMessage() {
        const text = document.getElementById("scamInput").value.trim();
        const resultContainer = id("resultContainer");

        if (!text) {
            alert("Please paste a message to analyze.");
            return;
        }

        // Simple static pattern matching representing the Agentic 4-Step Action Chain
        const lowerText = text.toLowerCase();
        const scamKeywords = ["urgent", "locked", "bank", "verify", "suspend", "winner", "prize", "gift card", "social security", "irs", "fbi", "click here", "password", "crypto", "wire"];
        
        let isScam = false;
        let matchedKeyword = "";
        
        for (let kw of scamKeywords) {
            if (lowerText.includes(kw)) {
                isScam = true;
                matchedKeyword = kw;
                break;
            }
        }

        let outputHTML = "";

        if (isScam || lowerText.length < 15) {
            // Step 2 & 3: Panic Interruption & Numbered Action Chain (Scam Detected)
            outputHTML = `
                <div class="halt-box">
                    <h3>⚠️ STOP. POTENTIAL SCAM DETECTED.</h3>
                    <p><strong>Threat Vector Identified:</strong> Suspicious language pattern matched ("${matchedKeyword}"). This message is exhibiting classic signs of digital fraud or financial exploitation.</p>
                </div>
                
                <div class="action-steps">
                    <h4>Required Safety Actions:</h4>
                    <ol>
                        <li><strong>Do Not Click Any Links:</strong> Tapping links in this message could compromise your device or personal data.</li>
                        <li><strong>Do Not Call Provided Numbers:</strong> Do not dial phone numbers listed inside this message. Scammers staff these lines directly.</li>
                        <li><strong>Verify Independently:</strong> If this claims to be from your bank, utility, or government agency, look at the back of your actual card or official statement and call that verified number directly.</li>
                        <li><strong>Delete the Message:</strong> Remove the threat from your inbox or phone immediately.</li>
                    </ol>
                </div>

                <div class="official-resources">
                    <h4>Official Florida & Federal Help Resources:</h4>
                    <ul>
                        <li>📞 <strong>DOEA Elder Helpline:</strong> <a href="tel:18009635337">1-800-96-ELDER (1-800-963-5337)</a></li>
                        <li>📞 <strong>Florida Abuse Hotline (Financial Exploitation):</strong> <a href="tel:18009622873">1-800-96-ABUSE</a></li>
                        <li>🌐 <strong>Operation Senior Shield:</strong> <a href="https://opseniorshieldfl.com/" target="_blank">opseniorshieldfl.com</a></li>
                        <li>⚖️ <strong>FTC Reporting Portal:</strong> <a href="https://reportfraud.ftc.gov" target="_blank">reportfraud.ftc.gov</a></li>
                    </ul>
                </div>
            `;
        } else {
            // Safe / Normal Message
            outputHTML = `
                <div class="safe-box">
                    <h3>✅ NO IMMEDIATE THREAT DETECTED</h3>
                    <p>The text analyzed does not contain common high-risk fraud keywords or emergency pressure tactics. However, always exercise normal digital caution before sharing personal or financial information.</p>
                </div>
                <div class="official-resources">
                    <h4>Need Guidance?</h4>
                    <p>If you still feel uneasy about this message, you can always contact the Florida Department of Elder Affairs Helpline at <a href="tel:18009635337">1-800-96-ELDER</a>.</p>
                </div>
            `;
        }

        resultContainer.style.display = "block";
        resultContainer.innerHTML = outputHTML;
        resultContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
        document.getElementById("scamInput").value = "";
        document.getElementById("resultContainer").style.display = "none";
    }

    function id(elementId) {
        return document.getElementById(elementId);
    }
</script>

</body>
</html>
